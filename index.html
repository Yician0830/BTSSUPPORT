<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTS 應援地圖｜維護中</title>
<meta name="description" content="BTS 應援地圖目前維護中，調整完成後會重新開放。">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#0b72e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06183a" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{--bg:#e6f5ff;--card:#fff;--ink:#0b2a5b;--sub:#4a6a96;--line:#b9dcf5;--dark:#0b4fa8;--darkInk:#fff;--navy:#062a6e;--gold:#ffd23f;--px:"DotGothic16","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#06183a;--card:#0c2a5c;--ink:#e6f4ff;--sub:#b4d0f2;--line:#1d4a8a;--dark:#7fd4ff;--darkInk:#06183a}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg);color:var(--ink);font:500 16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background-image:radial-gradient(color-mix(in srgb,var(--line) 55%,transparent) 1.2px,transparent 1.2px);background-size:22px 22px}
.box{width:100%;max-width:440px;background:var(--card);border:3px solid var(--dark);box-shadow:6px 6px 0 var(--line);text-align:center}
.wtb{display:flex;justify-content:space-between;align-items:center;height:28px;padding:0 10px;background:var(--dark);color:var(--darkInk);font-family:var(--px);font-size:12px;letter-spacing:.06em;line-height:28px}
.wtb em{font-style:normal;letter-spacing:.2em;opacity:.85}
.in{padding:28px 22px 26px}
.ic{width:96px;height:96px;margin:0 auto 14px;image-rendering:pixelated;animation:bob 1.6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
h1{margin:0 0 4px;font-family:var(--px);font-weight:400;font-size:30px;letter-spacing:.06em;line-height:1.3}
.tag{display:inline-block;margin:6px 0 14px;padding:2px 12px;font-family:var(--px);font-size:13px;letter-spacing:.14em;color:var(--navy);background:var(--gold);border:2px solid var(--navy)}
p{margin:0 0 8px;font-size:15px}
.sub{color:var(--sub);font-size:13px}
.bar{height:16px;margin:18px auto 6px;max-width:260px;border:3px solid var(--dark);background:color-mix(in srgb,var(--line) 40%,transparent);overflow:hidden;position:relative}
.bar i{position:absolute;top:0;left:-30%;width:30%;height:100%;background:var(--dark);animation:run 1.8s steps(12) infinite}
@keyframes run{to{left:100%}}
.btn{display:inline-block;margin-top:16px;padding:8px 22px;font:inherit;font-weight:800;font-size:14px;color:var(--darkInk);background:var(--dark);border:2px solid var(--navy);box-shadow:3px 3px 0 var(--navy);cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn:focus-visible{outline:3px solid #c21a55;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ic,.bar i{animation:none}.bar i{left:35%}}
</style>
</head>
<body>
<main class="box" role="main">
  <div class="wtb" aria-hidden="true"><span>maintenance.exe</span><em>– ▢ ×</em></div>
  <div class="in">
    <svg class="ic" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="6" y="0" width="3" height="1" fill="#0b4fa8"/>
      <rect x="5" y="1" width="1" height="3" fill="#0b4fa8"/>
      <rect x="9" y="1" width="1" height="3" fill="#0b4fa8"/>
      <rect x="6" y="1" width="3" height="3" fill="#6fb7ff"/>
      <rect x="7" y="3" width="1" height="2" fill="#0b4fa8"/>
      <rect x="6" y="4" width="3" height="1" fill="#0b4fa8"/>
      <rect x="5" y="4" width="2" height="1" fill="#ffd23f"/>
      <rect x="4" y="5" width="2" height="1" fill="#ffd23f"/>
      <rect x="3" y="6" width="2" height="1" fill="#ffd23f"/>
      <rect x="2" y="7" width="2" height="1" fill="#ffd23f"/>
      <rect x="1" y="8" width="2" height="1" fill="#ffd23f"/>
      <rect x="0" y="8" width="1" height="2" fill="#0b4fa8"/>
      <rect x="1" y="9" width="2" height="1" fill="#0b4fa8"/>
    </svg>
    <h1>BTS 應援地圖</h1>
    <span class="tag">MAINTENANCE</span>
    <p>網站維護中，內容調整完成後會重新開放。</p>
    <p class="sub">你的收藏、打卡與徽章紀錄都存在自己的瀏覽器裡，維護期間不會消失。</p>
    <div class="bar" role="progressbar" aria-label="維護中"><i></i></div>
    <p class="sub">Under maintenance. We'll be back soon.</p>
    <button type="button" class="btn" onclick="location.reload()">重新整理</button>
  </div>
</main>
</body>
</html>
