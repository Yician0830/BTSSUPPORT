<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>時間碼小工具｜BTS 應援地圖</title>
<style>
:root{--bg:#e6f3ff;--card:#fff;--ink:#0b2a5b;--sub:#5b7aa8;--line:#b8d8f5;--dark:#1469d6;--darkInk:#fff;--ok:#1a8f5a;--hl:#dff0ff}
@media(prefers-color-scheme:dark){:root{--bg:#06183a;--card:#0c2a5c;--ink:#e6f4ff;--sub:#8fb4e0;--line:#1d4a8a;--dark:#7fd4ff;--darkInk:#06183a;--ok:#5fd8a6;--hl:#143a75}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:6px 0 4px}
p.sub{margin:0 0 14px;color:var(--sub);font-size:14px}
label{display:block;font-weight:800;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);padding:10px 12px;border-radius:0}
textarea{min-height:200px;resize:vertical;line-height:1.7}
.btn{font:inherit;font-weight:800;border:2px solid var(--dark);background:var(--card);color:var(--dark);padding:10px 16px;cursor:pointer;box-shadow:0 3px 0 var(--line);border-radius:6px}
.btn.pri{background:var(--dark);color:var(--darkInk)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:none}
.hint{font-size:13px;color:var(--sub);margin-top:6px}
#work{display:none}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:2px dashed var(--line)}
.yt{position:relative;aspect-ratio:16/9;background:#000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%}
.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.ctl .btn{padding:10px 4px;text-align:center}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.st{font-size:18px;padding:16px 4px;text-align:center;color:#fff;border-color:transparent}
.st.n{background:var(--dark);color:var(--darkInk)}
.st.b{background:#3b6fe0}.st.r{background:#e0245e}.st.o{background:#c77a12}
.ln[data-c="藍"] .tx{color:#3b6fe0;font-weight:800}.ln[data-c="紅"] .tx{color:#e0245e;font-weight:800}.ln[data-c="橘"] .tx{color:#c77a12;font-weight:800}
@media(prefers-color-scheme:dark){.ln[data-c="藍"] .tx{color:#8fb4ff}.ln[data-c="紅"] .tx{color:#ff9ec0}.ln[data-c="橘"] .tx{color:#ffc069}}
.ln .cm{flex:none;width:22px;height:22px;border:2px solid var(--line);align-self:center;margin-left:-4px}
.ln[data-c="藍"] .cm{background:#3b6fe0;border-color:#3b6fe0}.ln[data-c="紅"] .cm{background:#e0245e;border-color:#e0245e}.ln[data-c="橘"] .cm{background:#c77a12;border-color:#c77a12}
.list{margin:12px 0}
.ln{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border:2px solid transparent;cursor:pointer}
.ln .tm{flex:none;width:52px;font-variant-numeric:tabular-nums;font-weight:800;color:var(--sub)}
.ln.done .tm{color:var(--ok)}
.ln .tx{flex:1;word-break:break-word}
.ln.cur{background:var(--hl);border-color:var(--dark)}
.ln .ed{flex:none;width:30px;text-align:center;color:var(--sub);align-self:center;font-size:15px}
.ln.editing{cursor:default;align-items:flex-start}
.ln .edwrap{flex:1;min-width:0}
.ln textarea.et{min-height:84px;padding:8px 10px;font-weight:400;color:var(--ink)}
.ln .edwrap .row{margin-top:6px}
.ln .edwrap .btn{padding:6px 14px}
.ic.b{color:#3b6fe0;font-weight:800}.ic.r{color:#e0245e;font-weight:800}
@media(prefers-color-scheme:dark){.ic.b{color:#8fb4ff}.ic.r{color:#ff9ec0}}
.ln .edwrap .btn.mb{background:#3b6fe0;border-color:#3b6fe0;color:#fff}.ln .edwrap .btn.mr{background:#e0245e;border-color:#e0245e;color:#fff}
.gap{height:12px}
#out{min-height:160px;white-space:pre}
.meta{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:6px 0 2px;font-size:14px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:var(--darkInk);padding:10px 18px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">

<div id="setup">
<h1>時間碼小工具</h1>
<p class="sub">邊看影片邊點按鈕，每點一下就替下一句記下目前的時間；點「藍／紅／橘」還會順便標上顏色，最後複製貼回試算表。</p>

<label for="url">YouTube 網址</label>
<input id="url" type="text" inputmode="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">

<label for="txt">歌詞（一行一句）</label>
<textarea id="txt" placeholder="貼上試算表「空耳」或「應援法」那一格的內容，一次處理一欄。&#10;可以含 [藍] [紅] [橘] 標記（會保留），原本有的時間碼會被重打。&#10;空白行會保留，不會被打時間碼。"></textarea>

<label for="off">反應補償（秒）</label>
<input id="off" type="number" step="0.1" min="0" max="2" value="0.3">
<div class="hint">你會比聽到的時間晚一點才點下去，補償會把時間往前拉。覺得整體偏晚就調大，偏早就調小。</div>

<div class="row" style="margin-top:18px">
<button class="btn pri" id="go" type="button">開始打時間碼</button>
</div>
</div>

<div id="work">
<div class="top">
<div class="yt"><div id="ytp"></div></div>
<div class="stamps">
<button class="btn st n" data-c="" type="button">打</button>
<button class="btn st b" data-c="藍" type="button">藍</button>
<button class="btn st r" data-c="紅" type="button">紅</button>
<button class="btn st o" data-c="橘" type="button">橘</button>
</div>
<div class="ctl">
<button class="btn" id="back5" type="button">⏪ 5 秒</button>
<button class="btn" id="play" type="button">⏯</button>
<button class="btn" id="skip" type="button">跳過</button>
<button class="btn" id="undo" type="button">復原</button>
</div>
<div class="row" style="margin-top:8px;justify-content:space-between">
<span class="hint" id="prog" style="margin:0"></span>
<select id="rate" style="width:auto;padding:6px 10px" aria-label="播放速度">
<option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option>
</select>
</div>
</div>

<div class="list" id="list"></div>

<div class="meta"><b>輸出結果</b><span id="cnt"></span></div>
<textarea id="out" readonly></textarea>
<div class="row" style="margin-top:10px">
<button class="btn pri" id="copy" type="button">複製結果</button>
<button class="btn" id="edit" type="button">← 回編輯</button>
</div>
<div class="hint">貼回試算表時，請先雙擊那一格進入編輯，再貼上，不然換行會被拆成很多列。點每句右邊的 ✎ 可以改文字；選取文字後按 {藍|} 或 {紅|} 會變成 {藍|文字} 的標記，文字會顯示成對應顏色；在文字裡按 Enter 換行，按「完成」就會拆成多句（第一句保留時間碼，新的句子要重打）。電腦快捷鍵：空白鍵／Enter＝打，1＝藍，2＝紅，3＝橘，Backspace＝復原。</div>
</div>

</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const TL=/^\s*\d{1,2}:\d{2}(?:\.\d+)?\s*/,CM=/^\s*\[(藍|紅|橘)\]\s?/;const COLS=["","藍","紅","橘"];
let lines=[],ptr=0,YP=null,vid="",PT=0;

try{$("#url").value=localStorage.getItem("tc-url")||"";$("#txt").value=localStorage.getItem("tc-txt")||"";$("#off").value=localStorage.getItem("tc-off")||"0.3"}catch(e){}

function ytId(u){u=(u||"").trim();let m=u.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);if(m)return m[1];return /^[\w-]{11}$/.test(u)?u:""}
function fmt(t){return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")}
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1400)}
function isBlank(l){return l.blank}
function nextIdx(from){for(let i=from;i<lines.length;i++)if(!lines[i].blank)return i;return lines.length}
function prevIdx(from){for(let i=from;i>=0;i--)if(!lines[i].blank)return i;return -1}

let ytReady=null;
function ytLoad(cb){if(window.YT&&YT.Player)return cb();if(!ytReady){ytReady=[];const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s);window.onYouTubeIframeAPIReady=()=>{ytReady.forEach(f=>f());ytReady=[]}}ytReady.push(cb)}

function start(){
  const id=ytId($("#url").value);
  const raw=$("#txt").value.replace(/\r/g,"").split("\n");
  while(raw.length&&!raw[raw.length-1].trim())raw.pop();
  if(!id){toast("請貼上正確的 YouTube 網址");return}
  if(!raw.length){toast("請貼上歌詞");return}
  try{localStorage.setItem("tc-url",$("#url").value);localStorage.setItem("tc-txt",$("#txt").value);localStorage.setItem("tc-off",$("#off").value)}catch(e){}
  lines=raw.map(r=>{let tx=r.replace(TL,""),c="";const m=tx.match(CM);if(m){c=m[1];tx=tx.replace(CM,"")}return{text:tx,blank:!tx.trim(),t:null,c}});
  ptr=nextIdx(0);vid=id;
  $("#setup").style.display="none";$("#work").style.display="block";
  window.scrollTo(0,0);
  render();
  const tk=++PT;
  try{YP&&YP.destroy()}catch(e){}YP=null;
  $("#work .yt").innerHTML='<div id="ytp"></div>';
  ytLoad(()=>{if(tk!==PT)return;YP=new YT.Player("ytp",{videoId:id,playerVars:{playsinline:1,rel:0},events:{onReady:()=>{try{YP.setPlaybackRate(+$("#rate").value)}catch(e){}}}})});
}

let editing=-1;
const IC=/\{(藍|紅)\|([^{}]*)\}/g;
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function rich(t){return esc(t).replace(IC,(m,c,x)=>'<span class="ic '+(c==="藍"?"b":"r")+'">'+x+'</span>')}
function render(){
  $("#list").innerHTML=lines.map((l,i)=>{
    if(l.blank)return'<div class="gap"></div>';
    const base=`<div class="ln${i===ptr?" cur":""}${l.t!=null?" done":""}${i===editing?" editing":""}" data-i="${i}" data-c="${l.c}"><span class="tm">${l.t!=null?fmt(l.t):"—"}</span><span class="cm" title="點一下換顏色"></span>`;
    if(i===editing)return base+'<div class="edwrap"><textarea class="et" placeholder="Enter 換行會拆成多句；選取文字後按 {藍|} 或 {紅|} 上色"></textarea><div class="row"><button class="btn pri" type="button" data-act="ok">完成</button><button class="btn" type="button" data-act="cancel">取消</button><button class="btn mb" type="button" data-act="藍">{藍|}</button><button class="btn mr" type="button" data-act="紅">{紅|}</button><button class="btn" type="button" data-act="清">清除色</button></div></div></div>';
    return base+'<span class="tx"></span><span class="ed" title="編輯文字／換行">✎</span></div>';
  }).join("");
  [...$("#list").children].forEach(e=>{if(e.dataset.i!=null&&+e.dataset.i!==editing)e.querySelector(".tx").innerHTML=rich(lines[+e.dataset.i].text)});
  if(editing>=0){const ta=$("#list .et");if(ta&&ta.dataset.init!=="1"){ta.value=lines[editing].text;ta.dataset.init="1"}}
  const tot=lines.filter(l=>!l.blank).length,done=lines.filter(l=>l.t!=null).length;
  $("#prog").textContent=ptr>=lines.length?"全部處理完了":"已打 "+done+" / "+tot+" 句";
  $("#cnt").textContent=done+" 句有時間碼";
  $("#out").value=lines.map(l=>l.blank?"":(l.t!=null?fmt(l.t)+" ":"")+(l.c?"["+l.c+"] ":"")+l.text).join("\n");
  const c=$("#list .cur");if(c){const top=$(".top").offsetHeight;const r=c.getBoundingClientRect();if(r.top<top+10||r.bottom>innerHeight-20)window.scrollTo({top:scrollY+r.top-top-60,behavior:"smooth"})}
}

function stamp(c){
  if(editing>=0){toast("先按「完成」或「取消」");return}
  if(!YP||!YP.getCurrentTime){toast("影片還沒準備好");return}
  if(ptr>=lines.length){toast("已經打完了");return}
  const off=Math.max(0,parseFloat($("#off").value)||0);
  lines[ptr].t=Math.max(0,Math.round(YP.getCurrentTime()-off));if(c)lines[ptr].c=c;
  ptr=nextIdx(ptr+1);
  render();
}
function skip(){if(editing>=0||ptr>=lines.length)return;ptr=nextIdx(ptr+1);render()}
function undo(){
  if(editing>=0)return;
  const p=prevIdx(Math.min(ptr,lines.length)-1);
  if(p<0)return;
  if(lines[p].t==null){ptr=p;render();return}
  lines[p].t=null;ptr=p;render();
  try{const t=YP.getCurrentTime();YP.seekTo(Math.max(0,t-3),true)}catch(e){}
}

function openEdit(i){editing=i;ptr=i;render();const ta=$("#list .et");if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}}
function commitEdit(){
  const ta=$("#list .et");if(!ta){editing=-1;return}
  const i=editing;editing=-1;
  const parts=ta.value.replace(/\r/g,"").split("\n").map(s=>s.trim()).filter(Boolean);
  if(!parts.length){render();return}
  const L=lines[i];
  const extra=parts.slice(1).map(p=>({text:p,blank:false,t:null,c:L.c}));
  lines.splice(i,1,Object.assign({},L,{text:parts[0]}),...extra);
  if(ptr>i)ptr+=extra.length;
  render();
  if(extra.length)toast("已拆成 "+parts.length+" 句");
}
function cancelEdit(){editing=-1;render()}
function mark(col){
  const ta=$("#list .et");if(!ta)return;
  const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value,sel=v.slice(s,e);
  if(col==="清"){
    const a=s===e?0:s,b=s===e?v.length:e;
    const out=v.slice(a,b).replace(IC,"$2");
    ta.value=v.slice(0,a)+out+v.slice(b);
    ta.focus();ta.setSelectionRange(a,a+out.length);return;
  }
  if(s===e){ta.value=v.slice(0,s)+"{"+col+"|}"+v.slice(e);const p=s+3;ta.focus();ta.setSelectionRange(p,p);return}
  const out=sel.split("\n").map(p=>p.trim()?"{"+col+"|"+p+"}":p).join("\n");
  ta.value=v.slice(0,s)+out+v.slice(e);
  ta.focus();ta.setSelectionRange(s,s+out.length);
}

$("#go").addEventListener("click",start);
document.querySelectorAll(".st").forEach(b=>b.addEventListener("click",()=>stamp(b.dataset.c)));
$("#skip").addEventListener("click",skip);
$("#undo").addEventListener("click",undo);
$("#back5").addEventListener("click",()=>{try{YP.seekTo(Math.max(0,YP.getCurrentTime()-5),true)}catch(e){}});
$("#play").addEventListener("click",()=>{try{YP.getPlayerState()===1?YP.pauseVideo():YP.playVideo()}catch(e){}});
$("#rate").addEventListener("change",()=>{try{YP.setPlaybackRate(+$("#rate").value)}catch(e){}});
$("#list").addEventListener("click",e=>{
  const r=e.target.closest(".ln");if(!r)return;
  const i=+r.dataset.i;
  const act=e.target.closest("[data-act]");
  if(act){const a=act.dataset.act;if(a==="ok")commitEdit();else if(a==="cancel")cancelEdit();else mark(a);return}
  if(e.target.closest(".edwrap"))return;
  if(editing>=0&&editing!==i){commitEdit();return}
  if(e.target.closest(".ed")){openEdit(i);return}
  if(e.target.closest(".cm")){lines[i].c=COLS[(COLS.indexOf(lines[i].c)+1)%COLS.length];render();return}
  if(e.target.closest(".tm")&&lines[i].t!=null){lines[i].t=null}
  ptr=i;render();
  if(lines[i].t!=null)try{YP.seekTo(Math.max(0,lines[i].t-2),true)}catch(x){}
});
$("#copy").addEventListener("click",async()=>{
  const v=$("#out").value;
  try{await navigator.clipboard.writeText(v);toast("已複製")}catch(e){$("#out").select();document.execCommand("copy");toast("已複製")}
});
$("#edit").addEventListener("click",()=>{
  if(lines.some(l=>l.t!=null)&&!confirm("回編輯會清掉目前打的時間碼，確定嗎？"))return;
  PT++;try{YP&&YP.destroy()}catch(e){}YP=null;
  $("#work").style.display="none";$("#setup").style.display="block";
});
document.addEventListener("keydown",e=>{
  if($("#work").style.display!=="block")return;
  const tg=e.target.tagName;if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT")return;
  if(e.code==="Space"||e.key==="Enter"){e.preventDefault();stamp("")}
  else if(e.key==="1"||e.key==="2"||e.key==="3"){e.preventDefault();stamp(COLS[+e.key])}
  else if(e.key==="Backspace"){e.preventDefault();undo()}
});
</script>
</body>
</html>
